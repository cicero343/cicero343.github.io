<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | A Diary of IT Projects</title>
  <meta name="generator" content="Jekyll v3.10.0" />
  <meta property="og:title" content="{{ page.title }}" />
  <meta name="author" content="cicero343" />
  <meta property="og:locale" content="en_US" />
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="A Diary of IT Projects" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta property="twitter:title" content="{{ page.title }}" />

  <!-- Favicons (local assets) -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}" />
  <link rel="shortcut icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon" />

  <!-- Consolidated site stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | relative_url }}" title="A Diary of IT Projects" />

  <!-- Set theme before paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="traffic-lights" aria-hidden="true">
      <span class="tl-r"></span><span class="tl-a"></span><span class="tl-g"></span>
    </div>

    <a href="{{ '/' | relative_url }}" class="site-title">
      <img src="https://avatars.githubusercontent.com/u/175522457?v=4" alt="cicero343's avatar" class="site-logo">
      <span><span class="prompt">cicero343@blog</span>:<span class="path-long">~/a-diary-of-it-projects</span></span>
    </a>

    <nav class="site-nav">
      {% for item in site.navbar %}
        <a class="nav-item" href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
    </nav>

    <div class="toggle-switch">
      <input type="checkbox" id="theme-toggle">
      <label for="theme-toggle" aria-label="Toggle dark mode">
        <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
        <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </label>
    </div>

    <div class="dropdown">
      <span class="dropdown-toggle" onclick="toggleDropdown()" aria-label="Menu">&#9776;</span>
      <div id="dropdown-content" class="dropdown-content">
        {% for item in site.navbar %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </div>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <h2 class="footer-heading"><span class="prompt">$</span> A Diary of IT Projects</h2>
      <div class="footer-icons">
        <a href="https://www.linkedin.com/in/benedict-c-donovan/" target="_blank" rel="noopener">
          <img src="https://www.svgrepo.com/show/391478/linkedin.svg" alt="LinkedIn" class="icon">
        </a>
        <a href="https://github.com/cicero343" target="_blank" rel="noopener">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub" class="icon">
        </a>
      </div>
    </div>
  </footer>

  <script>
    function toggleDropdown() {
      document.getElementById('dropdown-content').classList.toggle('show');
    }

    var toggle = document.getElementById('theme-toggle');
    // Reflect stored theme in the checkbox on load
    toggle.checked = (localStorage.getItem('theme') || 'light') === 'dark';

    toggle.addEventListener('change', function () {
      var theme = this.checked ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
    });
  </script>
</body>
</html>
